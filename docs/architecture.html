<!doctype html>
<html><head><meta charset="utf-8"><title>Clock Out architecture</title>
<style>body { margin:0; background:#0e1a2b; }</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#93a3b8"/></marker></defs>
  <rect width="1600" height="900" fill="#0e1a2b"/>
  <text x="80" y="92" font-size="48" font-weight="800" fill="#eef2f8">Clock Out — architecture</text>
  <text x="80" y="132" font-size="20" fill="#93a3b8">Next.js on Vercel · Base Sepolia · every payout signed by the restaurant's Dynamic payroll wallet</text>

  <rect x="80" y="210" width="300" height="140" rx="20" fill="#15243a" stroke="#ffd34e" stroke-opacity=".5"/>
  <text x="105" y="252" font-size="26" font-weight="800" fill="#eef2f8">Shift board</text>
  <text x="105" y="286" font-size="17" fill="#93a3b8">worker taps "Clock out"</text>
  <text x="105" y="316" font-size="15" fill="#2fbf85">POST /api/clockout</text>

  <rect x="80" y="400" width="300" height="140" rx="20" fill="#15243a" stroke="#f0a03c" stroke-opacity=".6"/>
  <text x="105" y="442" font-size="26" font-weight="800" fill="#eef2f8">Manager</text>
  <text x="105" y="476" font-size="17" fill="#93a3b8">approves a held shift</text>
  <text x="105" y="506" font-size="15" fill="#2fbf85">POST /api/approve</text>

  <rect x="500" y="200" width="460" height="360" rx="22" fill="#15243a" stroke="#2fbf85" stroke-width="2"/>
  <text x="525" y="246" font-size="26" font-weight="800" fill="#eef2f8">Payroll agent  (lib/agent.ts)</text>
  <text x="525" y="292" font-size="17" fill="#eef2f8">1  verify: on schedule · not over by 90 min</text>
  <text x="525" y="318" font-size="17" fill="#eef2f8">    · not paid twice · under $600 · funds</text>
  <text x="525" y="352" font-size="17" fill="#eef2f8">2  stub: wages · overtime 1.5× past 8h</text>
  <text x="525" y="378" font-size="17" fill="#eef2f8">    · tips − 20% tip-out → kitchen pool</text>
  <text x="525" y="412" font-size="17" fill="#eef2f8">3  decide: pay now, or hold with a reason</text>
  <text x="525" y="446" font-size="17" fill="#eef2f8">4  pay: coUSD transfer to the worker</text>
  <text x="525" y="494" font-size="15" fill="#93a3b8">deterministic house rules — lib/pay.ts</text>
  <text x="525" y="520" font-size="15" fill="#2fbf85">NDJSON stream → the pay stub prints live</text>

  <rect x="1080" y="200" width="440" height="170" rx="22" fill="#15243a" stroke="#2fbf85" stroke-width="2"/>
  <text x="1105" y="246" font-size="26" font-weight="800" fill="#eef2f8">Dynamic server wallet</text>
  <text x="1105" y="282" font-size="17" fill="#eef2f8">the restaurant's payroll · 2-of-2 MPC</text>
  <text x="1105" y="310" font-size="17" fill="#eef2f8">API-token auth · signTransaction</text>
  <text x="1105" y="344" font-size="15" fill="#2fbf85">lib/signer.ts · sendFromPayroll()</text>

  <rect x="1080" y="420" width="440" height="140" rx="22" fill="#fffdf6"/>
  <text x="1105" y="466" font-size="26" font-weight="800" fill="#1b2330">Base Sepolia</text>
  <text x="1105" y="500" font-size="17" fill="#1b2330">coUSD.transfer(worker, total)</text>
  <text x="1105" y="530" font-size="15" fill="#5b6576">lands in the worker's wallet in seconds</text>

  <rect x="500" y="620" width="460" height="130" rx="22" fill="#15243a" stroke="#eef2f8" stroke-opacity=".12"/>
  <text x="525" y="664" font-size="24" font-weight="800" fill="#eef2f8">Worker's phone  /me</text>
  <text x="525" y="698" font-size="17" fill="#93a3b8">"paid 3 seconds after you clocked out"</text>
  <text x="525" y="726" font-size="15" fill="#93a3b8">vs a biweekly payday · $0 fee</text>

  <path d="M380 280 H490" stroke="#93a3b8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M380 470 H490" stroke="#93a3b8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M960 285 H1070" stroke="#93a3b8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M1300 370 V410" stroke="#93a3b8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M1300 560 V685 H970" stroke="#93a3b8" stroke-width="1.5" stroke-dasharray="5 6" fill="none" marker-end="url(#a)"/>

  <text x="80" y="840" font-size="16" fill="#93a3b8">Testnet: coUSD is a test dollar, not real money. Lucía's, its staff and its POS tips are fictional; every payout is a real transfer.</text>
</svg>
</body></html>
